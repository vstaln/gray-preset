[package]
name = "gray-preset"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "Named working-preference bundles (/preset list|use|new). Port of pi's preset extension."

[[bin]]
name = "gray-preset"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[profile.release]
strip = true
